# Proyecto Xcode generado con XcodeGen (en el Mac: brew install xcodegen && xcodegen).
name: Diagnosis
options:
  bundleIdPrefix: com.sistemadiagnosis
  deploymentTarget:
    iOS: "16.0"
targets:
  Diagnosis:
    type: application
    platform: iOS
    sources: [DiagnosisApp]
    scheme: {}
    info:
      path: DiagnosisApp/Info.plist
      properties:
        CFBundleDisplayName: Diagnosis
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSBluetoothAlwaysUsageDescription: "Para conectar con el adaptador OBD Bluetooth."
        NSLocalNetworkUsageDescription: "Para conectar con el adaptador OBD WiFi."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sistemadiagnosis.app
        SWIFT_VERSION: "5.0"
        # Framework Kotlin (módulo core) que deja la fase de compilación de abajo.
        FRAMEWORK_SEARCH_PATHS: "$(SRCROOT)/../core/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        OTHER_LDFLAGS: ["$(inherited)", "-framework", "DiagnosisCore"]
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    preBuildScripts:
      - name: Compilar núcleo Kotlin
        basedOnDependencyAnalysis: false
        script: |
          if [ -z "$JAVA_HOME" ]; then export JAVA_HOME=$(/usr/libexec/java_home -v 17+ 2>/dev/null); fi
          cd "$SRCROOT/.."
          bash ./gradlew :core:embedAndSignAppleFrameworkForXcode
