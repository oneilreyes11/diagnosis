name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  jvm:
    name: Núcleo + CLI (JVM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - run: ./gradlew build

  ios:
    name: App iOS (simulador)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: Tests del núcleo en el simulador iOS
        run: ./gradlew :core:iosSimulatorArm64Test
      - name: Generar proyecto Xcode
        run: |
          brew install xcodegen
          cd ios && xcodegen
      - name: Compilar app
        run: >
          xcodebuild -project ios/Diagnosis.xcodeproj -scheme Diagnosis
          -sdk iphonesimulator -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO build
